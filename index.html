<!-- Google SRE Book (bản dịch tiếng Việt) — Docsify viewer, không cần build -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Site Reliability Engineering (Bản dịch tiếng Việt)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Google SRE Book - bản dịch tiếng Việt, đọc trực tuyến">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #4078c0; }
    .markdown-section img { max-width: 100%; }
    .app-name-link img { display: none; }

    /* Cỡ chữ tổng thể lớn hơn mặc định của theme vue (15px) — đọc sách dài đỡ mỏi mắt. */
    .markdown-section {
      font-size: 18px;
      line-height: 1.75;
      max-width: 700px;
    }
    /* vue.css ghi đè line-height về 1.6rem (25.6px, tỷ lệ 1.42) cho riêng p/ul/ol
       — chật với dấu tiếng Việt, khiến rule 1.75 phía trên không có tác dụng thực. */
    .markdown-section p, .markdown-section ul, .markdown-section ol {
      line-height: 1.75;
    }
    .markdown-section h1 { font-size: 2.2em; }
    .markdown-section h2 { font-size: 1.75em; }
    .markdown-section h3 { font-size: 1.4em; }
    .sidebar { font-size: 15px; }

    /* vue.css để code nhỏ hơn hẳn (0.8rem ≈ 12.8px) so với chữ thường 18px. */
    .markdown-section code, .markdown-section pre > code {
      font-size: 0.85em;
    }

    @media (max-width: 600px) {
      .markdown-section { max-width: none; padding: 24px 16px 40px; }
      .markdown-section h1 { font-size: 1.7em; }
      .markdown-section h2 { font-size: 1.4em; }
      .markdown-section table { font-size: 15px; }
      .markdown-section th, .markdown-section td { padding: 6px 10px; }
    }

    /* Figure image + caption: mỗi hình thật đều có <a id="hinh-..."> trong cùng
       <p> với ảnh (do pipeline dịch chèn anchor cho mọi hình/bảng có chú thích).
       2 hình công thức ở chương 3 không có anchor này — cố tình loại trừ để
       đoạn văn thường theo sau không bị dính nhầm style caption (xám, canh giữa). */
    .markdown-section p:has(> img) {
      text-align: center;
      margin: 2.2em 0;
    }
    .markdown-section p:has(> img) > img {
      max-width: 85%;
    }
    .markdown-section p:has(> a[id]):has(> img) + p {
      text-align: center;
      font-size: 0.9em;
      color: #555;
    }
    .markdown-section p:has(> a[id]):has(> img) + p a {
      font-weight: 600;
      color: #444;
    }

    /* Glossary/definition-term headings (converted from the book's term-then-
       description pattern, e.g. "Cảnh báo (Alerts)"). Deliberately NOT styled
       like a real h3 section: smaller, non-theme color, tight to the paragraph
       below it, so it reads as "this defines a term" not "new topic starts here". */
    .markdown-section h4 {
      font-size: 1.05em;
      font-weight: 700;
      color: #2c3e50;
      margin: 1.4em 0 0.3em;
      padding-bottom: 0;
      border-bottom: none;
    }

    /* Theme vue mặc định tô <em> màu xám đậm (#7f8c8d, tương phản thấp trên nền
       trắng) thay vì chỉ in nghiêng — khiến những cụm in nghiêng dài khó đọc,
       trông như tách khối riêng khỏi đoạn văn. Dùng opacity thay vì màu cố định
       để vẫn hơi nhạt hơn chữ thường (còn cảm giác emphasis) nhưng đủ tương phản
       để đọc, và tự thích ứng theo cả light/dark mode. */
    .markdown-section em {
      color: inherit;
      opacity: 0.82;
    }

    /* Chapter epigraph: metadata blockquote is always #1 (Nguyen ban/Nguon/Ban dich),
       the quote+attribution blockquote (when a chapter has one) is always #2. */
    .markdown-section blockquote:nth-of-type(2) {
      border-left: none;
      text-align: center;
      margin: 2em auto;
      padding: 0.5em 2em;
    }
    .markdown-section blockquote:nth-of-type(2) p:first-child {
      font-size: 1.3em;
      font-style: italic;
      color: var(--theme-color);
    }
    .markdown-section blockquote:nth-of-type(2) p:first-child::before { content: "\201C"; }
    .markdown-section blockquote:nth-of-type(2) p:first-child::after { content: "\201D"; }
    .markdown-section blockquote:nth-of-type(2) p:last-child:not(:first-child) {
      font-size: 0.85em;
      font-style: normal;
      color: #888;
      margin-top: 0.4em;
    }

    /* Nút chuyển sáng/tối thủ công — góc trên phải, luôn nổi trên nội dung. */
    #theme-toggle {
      position: fixed;
      top: 12px;
      right: 16px;
      z-index: 30;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(128, 128, 128, .3);
      border-radius: 50%;
      background: rgba(255, 255, 255, .9);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    /* Dark mode: sách 300+ trang, đọc ban đêm là chuyện thật. Áp qua class
       html.dark (đặt bởi script phía dưới) thay vì @media, để có nút chuyển
       thủ công — ưu tiên lựa chọn của người đọc hơn setting của OS.
       Bảng màu: nền ngả xanh xám (#1e2124) thay vì đen tuyền, contrast chữ
       thường ~10:1 (không quá 11-12:1 dễ chói/loá khi đọc lâu trên màn OLED). */
    html.dark { color-scheme: dark; }
    html:not(.dark) { color-scheme: light; }
    html.dark body { background: #1e2124; }
    html.dark .content, html.dark .markdown-section { background: #1e2124; color: #c9ced6; }
    html.dark .markdown-section h1, html.dark .markdown-section h2, html.dark .markdown-section h3 {
      color: #e6e9ed;
      border-bottom-color: #34383d;
    }
    html.dark .markdown-section h4 { color: #b8c4d0; }
    html.dark .markdown-section strong { color: #e6e9ed; }
    html.dark .markdown-section a { color: #6ea8ff; }
    html.dark .markdown-section code {
      background: #2b2f33;
      color: #e6c07b;
    }
    html.dark .markdown-section pre {
      background: #232629 !important;
    }
    html.dark .markdown-section pre > code {
      background: transparent;
      color: #c9ced6;
    }
    html.dark .markdown-section blockquote {
      color: #a8b0b9;
      border-left-color: #3d4248;
    }
    html.dark .markdown-section table tr {
      background: #1e2124;
      border-top-color: #34383d;
    }
    html.dark .markdown-section table tr:nth-child(2n) {
      background: #232629;
    }
    html.dark .markdown-section table td, html.dark .markdown-section table th {
      border-color: #34383d;
    }
    html.dark .sidebar {
      background: #1a1d20;
      border-color: #34383d;
    }
    html.dark .sidebar-toggle { background: rgba(30, 33, 36, .85); }
    html.dark .sidebar-nav a { color: #b3bac2; }
    html.dark .sidebar-nav a.active { color: #6ea8ff; }
    html.dark .sidebar-nav strong { color: #e6e9ed; }
    html.dark .app-name-link, html.dark .app-name-link:hover { color: #e6e9ed; }
    html.dark .search input {
      background: #2b2f33;
      color: #e6e9ed;
      border-color: #3d4248;
    }
    html.dark .search .matching-post { border-bottom-color: #34383d; }
    html.dark .search h2 { color: #e6e9ed; }
    html.dark .search .clear-button.show svg circle { fill: #555; }
    html.dark .docsify-pagination-container { border-top-color: #34383d; }
    html.dark #theme-toggle {
      background: rgba(43, 47, 51, .9);
      border-color: #3d4248;
    }
    /* Ảnh nội dung (hình/biểu đồ, đa số nền PNG trong suốt + chữ đen) gần như
       vô hình trên nền tối — lót nền trắng để vẫn đọc được. */
    html.dark .markdown-section img { background: #fff; padding: 8px 10px; border-radius: 6px; }
    html.dark .markdown-section p:has(> a[id]):has(> img) + p { color: #9aa2ad; }
    html.dark .markdown-section p:has(> a[id]):has(> img) + p a { color: #c9ced6; }
    html.dark .markdown-section blockquote:nth-of-type(2) p:first-child { color: #6ea8ff; }
    html.dark .markdown-section blockquote:nth-of-type(2) p:last-child:not(:first-child) { color: #9aa2ad; }
  </style>
  <!-- Chạy sync trước khi render body để tránh flash sai theme (FOUC).
       Ưu tiên lựa chọn thủ công đã lưu trong localStorage; nếu chưa chọn thì theo OS. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme'); // 'dark' | 'light' | null = theo OS
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      function apply(dark) { document.documentElement.classList.toggle('dark', dark); }
      apply(saved ? saved === 'dark' : mq.matches);
      mq.addEventListener('change', function (e) {
        if (!localStorage.getItem('theme')) apply(e.matches);
      });
      window.__toggleTheme = function () {
        var dark = !document.documentElement.classList.contains('dark');
        apply(dark);
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        return dark;
      };
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SRE Book (VI)',
      homepage: 'toc.md',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 0,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Tìm trong sách...',
        noData: 'Không tìm thấy kết quả.',
        depth: 3
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      plugins: [
        function (hook) {
          hook.mounted(function () {
            if (document.getElementById('theme-toggle')) return;
            var btn = document.createElement('button');
            btn.id = 'theme-toggle';
            btn.setAttribute('aria-label', 'Chuyển giao diện sáng/tối');
            var setIcon = function () {
              btn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
            };
            setIcon();
            btn.onclick = function () { window.__toggleTheme(); setIcon(); };
            document.body.appendChild(btn);
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Locally patched copy of docsify's search plugin: upstream strips Vietnamese
       diacritics for matching but then also uses the stripped text for display.
       This patch keeps the accent-insensitive matching but shows the original
       accented title/snippet. See assets/js/search-vi.js for the diff. -->
  <script src="assets/js/search-vi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>
</html>
